"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$username\
$directory \
$git_branch\
$git_status\
$cmd_duration
$character
"""

[username]
style_user = "blue"
show_always = true

[directory]
style = "cyan bold"
truncate_to_repo = false
truncation_length = 0

[git_branch]
symbol = " "
style = "white"

[git_status]
style = "white"

[cmd_duration]
min_time = 1000
format = "took $duration "

[character]
success_symbol = "[~](white)"
error_symbol = "[~](red)"
